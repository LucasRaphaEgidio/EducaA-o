<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - EducaAção</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>EducaAção - Junte-se a nós!</h1>
    </header>

    <main>
        <section>
            <h2 style="text-align: center;">Formulário de Voluntário</h2>
            <form action="login.html" method="get">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail Institucional:</label>
                <input type="email" id="email" name="email" required>

                <label for="curso">Curso:</label>
                <select id="curso" name="curso" required>
                    <option value="">Selecione...</option>
                    <option value="eng_comp">Engenharia da Computação</option>
                    <option value="eng_mec">Engenharia Mecânica</option>
                    <option value="outros">Outros</option>
                </select>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="18" required>

                <label for="senha">Crie uma Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <button type="submit">Cadastrar e ir para Login</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Projeto EducaAção - ODS 10</p>
    </footer>
</body>
</html>
