<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EducaAção</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>EducaAção - Acesso</h1>
    </header>

    <main>
        <section>
            <h2 style="text-align: center;">Entrar na Plataforma</h2>
            <!-- Redireciona para a página principal após submissão -->
            <form action="index.html" method="get">
                <label for="email_login">E-mail:</label>
                <input type="email" id="email_login" name="email_login" required>

                <label for="senha_login">Senha:</label>
                <input type="password" id="senha_login" name="senha_login" required>

                <button type="submit">Entrar</button>
            </form>
            <p style="text-align: center; margin-top: 20px;">Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Projeto EducaAção - ODS 10</p>
    </footer>
</body>
</html>
